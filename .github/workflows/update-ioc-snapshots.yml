name: Refresh bundled IOC snapshots
on:
  push:
    paths:
      - '.github/workflows/update-ioc-snapshots.yml'
  workflow_dispatch:
  schedule:
    - cron: '21 2 * * 1'
permissions:
  contents: write
jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Download and validate all three allowlisted feeds
        run: python scripts/vendor_ioc.py
      - name: Keep source attribution and license copy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/ioc/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh bundled IOC snapshots [skip ci]'
            git push
          fi
